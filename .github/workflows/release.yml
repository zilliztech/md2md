name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'zilliztech/md2md' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@^11.15
      - run: npm install -g yarn@1.22.22
      - run: yarn install --frozen-lockfile --non-interactive
      - run: yarn test
      - name: Read version and reject an existing tag
        id: version
        shell: bash
        run: |
          version=$(node -p 'require("./package.json").version')
          tag="v${version}"
          remote_tag=$(git ls-remote --tags origin "refs/tags/${tag}")
          if [[ -n "$remote_tag" ]]; then
            echo "::error::Tag ${tag} already exists."
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      - name: Stage npm package through OIDC
        id: stage
        run: npm stage publish
      - name: Tag the tested commit and create its GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/${RELEASE_TAG}"
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" \
            --notes 'Package staged on npm; public availability requires maintainer review and 2FA approval on npmjs.com.'
      - name: Explain recovery after staging
        if: failure() && steps.stage.outcome == 'success'
        run: |
          echo '::error::The package was staged, but tagging or Release creation failed. Inspect the staged version on npmjs.com and recover the GitHub tag/Release manually; do not blindly restage this version.'
